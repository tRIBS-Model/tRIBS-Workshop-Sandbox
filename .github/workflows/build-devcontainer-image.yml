name: Build devcontainer image

# Builds .devcontainer/Dockerfile once, here, and publishes it to GHCR so that
# creating a codespace is an image pull instead of a full tRIBS compile plus a
# scientific-Python dependency resolve.
on:
  push:
    branches: [main, dev]
    paths:
      - '.devcontainer/Dockerfile'
      - '.github/workflows/build-devcontainer-image.yml'
  # Scheduled runs only ever fire on the default branch (main). Keeps the
  # published image current as the tRIBS/pytRIBS dev branches move.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  build:
    # This repo is a template. Without this guard, every repo an attendee
    # creates from it would run its own image build on first push.
    if: github.repository == 'tRIBS-Model/tRIBS-Workshop-Sandbox'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is hardcoded lowercase: GHCR rejects uppercase, and the org
      # is spelled tRIBS-Model.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tribs-model/tribs-workshop-sandbox
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
